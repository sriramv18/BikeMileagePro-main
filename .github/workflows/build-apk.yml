name: Build Bike Mileage Pro Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "settings.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/sriram/bikemileagepro/MainActivity.kt"
            "app/src/main/java/com/sriram/bikemileagepro/RideTrackingService.kt"
            "app/src/main/java/com/sriram/bikemileagepro/ActiveTripStore.kt"
            "app/src/main/java/com/sriram/bikemileagepro/ElmBleConnection.kt"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required project file is missing: $file"
              exit 1
            fi
            echo "OK: $file"
          done

          if ! grep -Fq 'versionName = "1.0.6"' app/build.gradle.kts; then
            echo "ERROR: app/build.gradle.kts must declare versionName = \"1.0.6\""
            exit 1
          fi
          if ! grep -Fq 'android:foregroundServiceType="location"' app/src/main/AndroidManifest.xml; then
            echo "ERROR: RideTrackingService location foreground-service type is missing from AndroidManifest.xml"
            exit 1
          fi
          echo "Project structure verification passed."

      - name: Prepare persistent debug signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]]; then
            echo "ERROR: Configure the ANDROID_SIGNING_KEYSTORE_BASE64 repository secret before building."
            exit 1
          fi
          if [[ -z "$ANDROID_SIGNING_STORE_PASSWORD" || -z "$ANDROID_SIGNING_KEY_ALIAS" || -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "ERROR: Configure ANDROID_SIGNING_STORE_PASSWORD, ANDROID_SIGNING_KEY_ALIAS, and ANDROID_SIGNING_KEY_PASSWORD repository secrets."
            exit 1
          fi
          key_path="$RUNNER_TEMP/bikemileagepro-debug.keystore"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "ANDROID_SIGNING_KEYSTORE=$key_path" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeMileagePro-Native-Kotlin-v1.0.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests (mileage maths and route codec)
        run: gradle --no-daemon testDebugUnitTest
