name: Build Bike Mileage Pro Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sriram/bikemileagepro/MainActivity.kt
          test -f app/src/main/java/com/sriram/bikemileagepro/RideTrackingService.kt

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeMileagePro-Native-Kotlin-v0.5.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
