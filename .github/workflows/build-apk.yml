name: Build Bike Mileage Pro Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "settings.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/sriram/bikemileagepro/MainActivity.kt"
            "app/src/main/java/com/sriram/bikemileagepro/RideTrackingService.kt"
            "app/src/main/java/com/sriram/bikemileagepro/ActiveTripStore.kt"
            "app/src/main/java/com/sriram/bikemileagepro/ElmBleConnection.kt"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required project file is missing: $file"
              exit 1
            fi
            echo "OK: $file"
          done

          if ! grep -Fq 'versionName = "1.0.6"' app/build.gradle.kts; then
            echo "ERROR: app/build.gradle.kts must declare versionName = \"1.0.4\""
            exit 1
          fi
          if ! grep -Fq 'android:foregroundServiceType="location"' app/src/main/AndroidManifest.xml; then
            echo "ERROR: RideTrackingService location foreground-service type is missing from AndroidManifest.xml"
            exit 1
          fi
          echo "Project structure verification passed."

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeMileagePro-Native-Kotlin-v1.0.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests (mileage maths and route codec)
        run: gradle --no-daemon testDebugUnitTest
