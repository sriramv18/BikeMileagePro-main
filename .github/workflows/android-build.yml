name: Bike Mileage Pro Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: Build standalone Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate React Native Android host
        run: |
          npx --yes @react-native-community/cli@latest init BikeMileagePro --skip-install
          cp -R mobile/src BikeMileagePro/src
          cp mobile/tsconfig.json BikeMileagePro/tsconfig.json
          cat > BikeMileagePro/App.tsx <<'APP_EOF'
          export { default } from './src/App';
          APP_EOF

      - name: Install app dependencies
        working-directory: BikeMileagePro
        run: |
          npm install
          npm install @react-navigation/native@^7 @react-navigation/bottom-tabs@^7 react-native-safe-area-context@^5 react-native-screens@^4

      - name: Configure app name and launcher icon
        run: |
          APP=BikeMileagePro/android/app/src/main
          mkdir -p "$APP/res/drawable"
          mkdir -p "$APP/res/mipmap-anydpi-v26"
          # Adaptive icon XML must live only in the API 26+ resource directory.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('BikeMileagePro/android/app/src/main/res/values/strings.xml')
          s=p.read_text()
          import re
          if re.search(r'<string name="app_name">.*?</string>', s):
              s=re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Bike Mileage Pro</string>', s)
          else:
              s=s.replace('</resources>', '    <string name="app_name">Bike Mileage Pro</string>\n</resources>')
          p.write_text(s)
          PY
          cat > "$APP/res/drawable/ic_launcher_foreground.xml" <<'ICON_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B6E5E" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M25,68a15,15 0,1 0,30 0a15,15 0,1 0,-30 0M53,68a15,15 0,1 0,30 0a15,15 0,1 0,-30 0" />
              <path android:fillColor="#FFFFFF" android:pathData="M34,64l12,-23h15l12,23h-8l-9,-16h-6l-8,16z" />
              <path android:fillColor="#FFFFFF" android:pathData="M43,39h17v5h-17z" />
          </vector>
          ICON_EOF
          cat > "$APP/res/mipmap-anydpi-v26/ic_launcher.xml" <<'XML_EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML_EOF
          cat > "$APP/res/mipmap-anydpi-v26/ic_launcher_round.xml" <<'XML_EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML_EOF
          # Set icon attributes idempotently; avoid duplicate XML attributes.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          p = Path('BikeMileagePro/android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(p)
          root = tree.getroot()
          app = root.find('application')
          if app is None:
              raise SystemExit('AndroidManifest.xml has no <application> element')
          ns = '{http://schemas.android.com/apk/res/android}'
          app.set(ns + 'icon', '@mipmap/ic_launcher')
          app.set(ns + 'roundIcon', '@mipmap/ic_launcher_round')
          tree.write(p, encoding='utf-8', xml_declaration=True)
          # Parse again so malformed XML fails before Gradle starts.
          ET.parse(p)
          PY

      - name: Build release APK (bundles JavaScript into the APK)
        working-directory: BikeMileagePro/android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew :app:assembleRelease

      - name: Verify APK and bundled JavaScript
        run: |
          APK=BikeMileagePro/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|lib/.*\.so' >/dev/null
          echo "Release APK created: $APK"

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bike-Mileage-Pro-release-APK
          path: BikeMileagePro/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
