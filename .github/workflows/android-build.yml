name: Bike Mileage Pro Flutter Android APK
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform host (Flutter embedding v2)
        run: flutter create --platforms=android --org com.bikemileagepro .

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"

          required = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          existing = {node.get(android + "name") for node in root.findall("uses-permission")}
          for permission in required:
              if permission not in existing:
                  node = ET.Element("uses-permission")
                  node.set(android + "name", permission)
                  root.insert(0, node)

          app = root.find("application")
          if app is not None:
              app.set(android + "label", "Bike Mileage Pro")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)
          PY

      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bike-Mileage-Pro-Flutter-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
